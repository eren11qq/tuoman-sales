name: Bug Report
description: Report a bug to help improve 拓漫 TouMan
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run 'tuoman ...'
        2. ...
        3. See error
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 拓漫 Version
      description: Run `tuoman version` and paste output
