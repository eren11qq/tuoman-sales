[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tuoman-agent"
version = "0.21.0"
description = "拓漫 TouMan — AI漫剧行业智能获客管线（垂直领域版）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "拓漫 TouMan" }]
license = "MIT"
dependencies = [
    "openai>=1.0.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
type = [
    "pyright>=1.1.300",
]

[project.scripts]
tuoman = "tuoman.cli:main"

[tool.setuptools.packages.find]
include = ["tuoman", "tuoman.*"]

[tool.setuptools.package-data]
tuoman = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 需要浏览器或网络连接",
    "crawler: 爬虫测试（需要 Playwright）",
]

[tool.ruff]
preview = true
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["PLW1514", "F", "E", "W"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
exclude = [".venv", "dist", "build"]
reportMissingImports = true
reportUnusedImport = true
