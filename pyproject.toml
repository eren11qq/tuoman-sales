[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tuoman-agent"
version = "0.20.0"
description = "拓漫 TouMan — AI漫剧行业智能获客Agent（垂直领域版）"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "拓漫 TouMan" }]
license = "MIT"
dependencies = [
    "openai>=1.0.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
tuoman = "scripts.daily:main"

[tool.setuptools.packages.find]
include = ["tuoman", "tuoman.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
preview = true

[tool.ruff.lint]
select = ["PLW1514", "F", "E"]
